# ============================================================
# .github/workflows/playwright.yml
# Playwright + Allure + GitHub Pages (Live Report URL)
# ============================================================

name: Playwright Tests - CI Pipeline

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write   # REQUIRED for GitHub Pages

jobs:
  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ── STEP 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── STEP 2: Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # ── STEP 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # ── STEP 4: Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ── STEP 5: Run tests
      - name: Run Playwright tests
        run: npx playwright test tests/test.spec.js
        env:
          CI: true

      # ── STEP 6: Install Allure CLI
      - name: Install Allure CLI
        run: npm install -g allure-commandline --save-dev

      # ── STEP 7: (Optional) Pull previous history for trend
      - name: Load previous Allure history
        run: |
          git clone --depth 1 --branch gh-pages https://github.com/${{ github.repository }} gh-pages || true
          if [ -d "gh-pages/history" ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/history/* allure-results/history/
          fi

      # ── STEP 8: Generate Allure Report
      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report

      # ── STEP 9: Deploy report to GitHub Pages (THIS CREATES URL)
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      # ── STEP 10: Upload report as artifact (backup)
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # ── STEP 11: Upload failure artifacts
      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 30