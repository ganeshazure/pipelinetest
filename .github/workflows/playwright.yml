# ============================================================
# .github/workflows/playwright.yml
# Playwright + Allure (CLEAN REPORT each run)
# ============================================================

name: Playwright Tests - CI Pipeline

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ── STEP 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── STEP 2: Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # ── STEP 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # ── STEP 4: Install Chromium ONLY (faster)
      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      # ── STEP 5: Clean old Allure data (IMPORTANT)
      - name: Clean Allure folders
        run: rm -rf allure-results allure-report

      # ── STEP 6: Run tests (ONLY what you specify)
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      # ── STEP 7: Install Allure CLI
      - name: Install Allure CLI
        run: npm install -g allure-commandline --save-dev

      # ── STEP 8: Generate fresh Allure report
      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report

      # ── STEP 9: Deploy report (shareable URL)
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      # ── STEP 10: Upload report (backup)
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # ── STEP 11: Upload failure artifacts
      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 30