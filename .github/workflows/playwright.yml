# ============================================================
# .github/workflows/playwright.yml
# Playwright + Allure CI Pipeline
# ============================================================

name: Playwright Tests - CI Pipeline

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ── STEP 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── STEP 2: Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # ── STEP 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # ── STEP 4: Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ── STEP 5: Run tests (Allure results will be generated here)
      - name: Run Playwright tests
        run: npx playwright test tests/test.spec.js
        env:
          CI: true

      # ── STEP 6: Install Allure CLI
      - name: Install Allure CLI
        run: npm install -g allure-commandline --save-dev

      # ── STEP 7: Generate Allure Report
      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report

      # ── STEP 8: Upload Allure Report (FINAL REPORT)
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # ── STEP 9: Upload raw Allure results (optional, for debugging/history)
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      # ── STEP 10: Upload failure screenshots/videos
      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 30